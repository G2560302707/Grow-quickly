# 生产环境 compose（本地构建，访问经 Nginx 443 反代）
# 用法：
#   1. 复制 .env.prod -> .env 并填好密钥
#   2. docker compose -f deploy/docker-compose.yml up -d --build
#   3. 配置 Nginx（见 deploy/nginx/after7lab.conf）
# 与 ghcr.io 镜像无关，纯本地 build，无需镜像仓库。

services:
  # 学习端后端（Next.js standalone，端口对外仅经 Nginx）
  wrong-notebook:
    build:
      context: ..
      dockerfile: Dockerfile
    image: wrong-notebook:local
    container_name: wrong-notebook
    restart: always
    ports:
      - "127.0.0.1:3100:3000"   # 只暴露内网/本机，由 Nginx 反代（容器外 3100）
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - LOG_LEVEL=info
      # 微信小程序登录
      - WECHAT_APPID=${WECHAT_APPID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      # AI（与 app-config.json 二选一；此处为环境变量方式）
      - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL}
      - GEMINI_MODEL=${GEMINI_MODEL}
    env_file:
      - .env
    volumes:
      - ./data:/app/data        # SQLite，必须持久化
      - ./config:/app/config    # AI 密钥（管理后台写入 app-config.json）

  # 管理后台（与学习端共享同一 SQLite/config）
  # 默认仅内网可访问；如需公网，再在 Nginx 单独加 location（建议加 basic auth 或 IP 白名单）
  wrong-notebook-admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
    image: wrong-notebook-admin:local
    container_name: wrong-notebook-admin
    restart: always
    ports:
      - "127.0.0.1:3200:3001"
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - APP_CONFIG_PATH=/app/config/app-config.json
      - AUTH_TRUST_HOST=true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config