
server {
    listen 443 ssl;
    http2 on;
    server_name after7lab.cloud;

    # 证书路径
    ssl_certificate     /usr/local/key/after7lab.cloud_bundle.crt;
    ssl_certificate_key /usr/local/key/after7lab.cloud.key; 
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;   # 错题拍照/图片上传

    # 管理后台：/admin 前缀（admin 应用已设 basePath=/admin），
    # 连同 /admin/_next/ 静态资源、/admin/api/ 一并反代到管理后台容器
    location /admin {
        proxy_pass http://host.docker.internal:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 其余请求（页面 /_next/ 静态资源 /api/）统一反代到学习端容器，
    # Next.js 前后端一体，自行区分页面与 API；同源避免跨域预检
    location / {
        proxy_pass http://host.docker.internal:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
