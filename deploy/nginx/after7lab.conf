# 生产 Nginx：一个域名，一个入口
#   https://after7lab.cloud/          → Web端 H5 + 后端 API（同源 /api）
#   https://after7lab.cloud/admin/*   → 管理后台（同域路径，反代 :3200）
# 纯 443（80 不可用，无需 80 块）
# 需一条 DNS A 记录：@ -> IP
#
# Ubuntu/Debian:
#   sudo cp deploy/nginx/after7lab.conf /etc/nginx/sites-available/after7lab.conf
#   sudo ln -s /etc/nginx/sites-available/after7lab.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (CentOS/RHEL 改放 /etc/nginx/conf.d/after7lab.conf)
# 证书需同时覆盖 api. and admin.（通配符 *.after7lab.cloud 最省事）

# ---------- 主域：Next.js 学习端（前后端一体，页面 + API 同源） ----------
server {
    listen 443 ssl;
    http2 on;
    server_name after7lab.cloud;

    # 证书路径
        ssl_certificate     /usr/local/key/after7lab.cloud_bundle.crt;
    ssl_certificate_key /usr/local/key/after7lab.cloud.key; ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;   # 错题拍照/图片上传

    # 管理后台：/admin 前缀（admin 应用已设 basePath=/admin），
    # 连同 /admin/_next/ 静态资源、/admin/api/ 一并反代到管理后台容器
    location /admin {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 其余请求（页面 /_next/ 静态资源 /api/）统一反代到学习端容器，
    # Next.js 前后端一体，自行区分页面与 API；同源避免跨域预检
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
