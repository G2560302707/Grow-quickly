version: '3'

services:
  wrong-notebook:
    image: ghcr.io/wttwins/wrong-notebook:latest
    container_name: wrong-notebook
    restart: always
    ports:
      - "3000:3000"
    environment:
      # NEXTAUTH_URL 根据实际情况设置你的信息
      #- NEXTAUTH_URL=http://your_domain_name:3000
      - NEXTAUTH_SECRET=your_secret_key
    volumes:
      # Persist the SQLite database
      - ./data:/app/data
      - ./config:/app/config

  # 管理后台（本地构建；与学习端共享同一个 SQLite 与配置文件）
  # 生产环境建议只在内网/VPN 或加 IP 白名单暴露 3001
  wrong-notebook-admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: wrong-notebook-admin
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NEXTAUTH_SECRET=your_secret_key
      - APP_CONFIG_PATH=/app/config/app-config.json
    volumes:
      - ./data:/app/data
      - ./config:/app/config

